keys:
  - &primary 
  - &work 
creation_rules:
  - path_regex: modules/hosts/laptop/_secrets/secrets.yaml$
    key_groups:
      - age:
        - *primary
  - path_regex: modules/hosts/server/_secrets/secrets.yaml$
    key_groups:
      - age:
        - *primary
  - path_regex: modules/hosts/work/_secrets/secrets.yaml$
    key_groups:
      - age:
        - *work
        - *primary
